<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
<title id="title">Ciclo de refrigeración: evaporador, compresor, condensador y válvula de expansión</title>
<desc id="desc">Esquema didáctico de cuatro etapas conectadas. El compresor hermético se muestra en corte con motor eléctrico, biela y pistón. El dispositivo de expansión se muestra como una válvula que regula el paso a través de un orificio estrecho.</desc>
<defs>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#edf7ff"/></linearGradient>
 <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#087ff5"/></marker>
 <marker id="orangeArrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#ff7618"/></marker>
</defs>
<rect x="2" y="2" width="1196" height="706" rx="32" fill="url(#panel)" stroke="#c6e3fb" stroke-width="3"/>
<text x="600" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="800" letter-spacing="4" fill="#087ff5">EL RECORRIDO DEL REFRIGERANTE</text>
<text x="600" y="98" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#58718b">Cuatro procesos conectados: cada equipo tiene condiciones de trabajo propias</text>
<path d="M540 260H650" fill="none" stroke="#087ff5" stroke-width="11" stroke-linecap="round" marker-end="url(#blueArrow)"/>
<path d="M900 368V438" fill="none" stroke="#ff7618" stroke-width="11" stroke-linecap="round" marker-end="url(#orangeArrow)"/>
<path d="M660 548H550" fill="none" stroke="#ff7618" stroke-width="11" stroke-linecap="round" marker-end="url(#orangeArrow)"/>
<path d="M300 438V368" fill="none" stroke="#087ff5" stroke-width="11" stroke-linecap="round" marker-end="url(#blueArrow)"/>
<!-- Evaporador -->
<rect x="60" y="155" width="480" height="213" rx="28" fill="#fff" stroke="#a9dafa" stroke-width="4"/><rect x="82" y="178" width="170" height="166" rx="22" fill="#eff9ff"/>
<g fill="none" stroke="#1397ed" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M113 210v102h25V210h27v102h25V210h27v102h12"/><path d="M103 220h132M103 244h132M103 268h132M103 292h132" stroke="#8bcdf5" stroke-width="4"/></g><path d="M110 193v-18m45 18v-18m45 18v-18" stroke="#087ff5" stroke-width="4" stroke-linecap="round"/>
<text x="280" y="221" font-family="Arial,sans-serif" font-size="24" font-weight="800" fill="#123b63">1 · EVAPORADOR</text><text x="280" y="257" font-family="Arial,sans-serif" font-size="16" fill="#486781">Absorbe calor del recinto.</text><text x="280" y="286" font-family="Arial,sans-serif" font-size="16" fill="#486781">El líquido hierve y pasa a vapor.</text><rect x="280" y="309" width="196" height="34" rx="17" fill="#e5f5ff"/><text x="378" y="332" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="1" fill="#0874df">ABSORBE CALOR</text>
<!-- Compresor hermético en corte: carcasa, motor, biela y pistón -->
<rect x="660" y="155" width="480" height="213" rx="28" fill="#fff" stroke="#c5d9eb" stroke-width="4"/><rect x="682" y="178" width="170" height="166" rx="22" fill="#f2f8fd"/>
<path d="M725 226c0-19 15-34 34-34h28c19 0 34 15 34 34v81c0 22-18 39-40 39h-16c-22 0-40-17-40-39z" fill="#e5f0f8" stroke="#416d94" stroke-width="7"/>
<path d="M729 226c0-19 14-34 31-34h26c17 0 31 15 31 34v10h-88z" fill="#d0e4f3" stroke="#416d94" stroke-width="5"/>
<path d="M745 233h55v22h-55z" fill="#fff" stroke="#416d94" stroke-width="4"/><path d="M747 236v16m9-16v16m9-16v16m9-16v16m9-16v16m9-16v16" stroke="#087ff5" stroke-width="3"/>
<path d="M752 261v29m42-29v29" stroke="#416d94" stroke-width="5"/><circle cx="773" cy="301" r="11" fill="#ff8a31" stroke="#bf5f18" stroke-width="4"/><path d="M773 290v-20" stroke="#bf5f18" stroke-width="5"/><path d="M723 280h-16v-17m116-22h14v-19" fill="none" stroke="#416d94" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M730 322h65" stroke="#416d94" stroke-width="4"/>
<text x="880" y="221" font-family="Arial,sans-serif" font-size="24" font-weight="800" fill="#123b63">2 · COMPRESOR</text><text x="880" y="257" font-family="Arial,sans-serif" font-size="16" fill="#486781">El motor acciona el mecanismo interno.</text><text x="880" y="286" font-family="Arial,sans-serif" font-size="16" fill="#486781">Aspira y comprime el vapor.</text><rect x="880" y="309" width="201" height="34" rx="17" fill="#edf5fb"/><text x="980" y="332" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="1" fill="#416d94">APORTA ENERGÍA</text>
<!-- Condensador -->
<rect x="660" y="438" width="480" height="213" rx="28" fill="#fff" stroke="#ffd1b0" stroke-width="4"/><rect x="682" y="461" width="170" height="166" rx="22" fill="#fff7f1"/><g fill="none" stroke="#f47721" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M713 493v102h25V493h27v102h25V493h27v102h12"/><path d="M703 503h132M703 527h132M703 551h132M703 575h132" stroke="#ffc18e" stroke-width="4"/></g><path d="M719 481v-15m45 15v-15m45 15v-15" stroke="#ff7618" stroke-width="4" stroke-linecap="round"/>
<text x="880" y="504" font-family="Arial,sans-serif" font-size="24" font-weight="800" fill="#123b63">3 · CONDENSADOR</text><text x="880" y="540" font-family="Arial,sans-serif" font-size="16" fill="#486781">Cede calor al ambiente.</text><text x="880" y="569" font-family="Arial,sans-serif" font-size="16" fill="#486781">El vapor se vuelve líquido.</text><rect x="880" y="592" width="198" height="34" rx="17" fill="#fff0e4"/><text x="979" y="615" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="1" fill="#df6417">LIBERA CALOR</text>
<!-- Dispositivo de expansión: cuerpo de válvula, asiento y aguja -->
<rect x="60" y="438" width="480" height="213" rx="28" fill="#fff" stroke="#b9dcf7" stroke-width="4"/><rect x="82" y="461" width="170" height="166" rx="22" fill="#f1f8fe"/>
<path d="M99 548h32m88 0h30" fill="none" stroke="#087ff5" stroke-width="8" stroke-linecap="round"/><path d="M131 524h84v48h-84z" fill="#dceefa" stroke="#416d94" stroke-width="5" stroke-linejoin="round"/><path d="M131 548h30l12-13 12 13h30" fill="none" stroke="#087ff5" stroke-width="5" stroke-linejoin="round"/><path d="M173 502v29m-23-1h46m-23-28v-18" fill="none" stroke="#416d94" stroke-width="5" stroke-linecap="round"/><path d="M158 482h30" stroke="#ff7618" stroke-width="5" stroke-linecap="round"/><path d="M215 536v24" stroke="#087ff5" stroke-width="4" marker-end="url(#blueArrow)"/>
<text x="280" y="504" font-family="Arial,sans-serif" font-size="18" font-weight="800" fill="#123b63">4 · DISPOSITIVO DE EXPANSIÓN</text><text x="280" y="540" font-family="Arial,sans-serif" font-size="16" fill="#486781">La válvula regula el caudal.</text><text x="280" y="569" font-family="Arial,sans-serif" font-size="16" fill="#486781">El orificio reduce su presión.</text><rect x="280" y="592" width="196" height="34" rx="17" fill="#e5f5ff"/><text x="378" y="615" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="1" fill="#0874df">REGULA EL PASO</text>
<text x="600" y="685" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#6b8298">Esquema conceptual. Las presiones, temperaturas y estados exactos dependen del refrigerante y del diseño.</text>
</svg>

