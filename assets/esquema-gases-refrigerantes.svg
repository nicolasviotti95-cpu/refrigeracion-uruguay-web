<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Cómo cambia el refrigerante dentro del ciclo</title>
  <desc id="desc">Circuito educativo con evaporador frío, compresor, condensador cálido y dispositivo de expansión.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fcff"/><stop offset="1" stop-color="#eaf6ff"/></linearGradient>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#087ff5"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ff7618"/></marker>
  </defs>
  <rect x="1" y="1" width="1198" height="518" rx="30" fill="url(#bg)" stroke="#c9e5fc" stroke-width="2"/>
  <text x="600" y="54" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="800" letter-spacing="4" fill="#087ff5">EL RECORRIDO DEL REFRIGERANTE</text>
  <text x="600" y="84" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#58718b">El estado del fluido cambia según la presión y el intercambio de calor</text>
  <path d="M300 214H425" fill="none" stroke="#087ff5" stroke-width="8" marker-end="url(#arrowBlue)"/>
  <path d="M575 214H700" fill="none" stroke="#ff7618" stroke-width="8" marker-end="url(#arrowOrange)"/>
  <path d="M880 250V365H705" fill="none" stroke="#ff7618" stroke-width="8" marker-end="url(#arrowOrange)"/>
  <path d="M495 365H300V250" fill="none" stroke="#087ff5" stroke-width="8" marker-end="url(#arrowBlue)"/>
  <rect x="70" y="142" width="230" height="145" rx="24" fill="#fff" stroke="#a9d9fb" stroke-width="3"/>
  <g fill="none" stroke="#159cf0" stroke-width="7" stroke-linecap="round"><path d="M105 174v82h30v-82h30v82h30v-82h30v82h30v-82"/><path d="M100 184h150M100 202h150M100 220h150M100 238h150M100 256h150" stroke="#90cff7" stroke-width="3"/></g>
  <text x="185" y="316" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="#13395f">EVAPORADOR</text>
  <text x="185" y="343" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#42627f">absorbe calor · evapora</text>
  <rect x="425" y="142" width="150" height="145" rx="24" fill="#fff" stroke="#b7d3eb" stroke-width="3"/>
  <path d="M462 245v-60c0-22 17-38 38-38s38 16 38 38v60c0 16-16 24-38 24s-38-8-38-24Z" fill="#eaf4fc" stroke="#416b91" stroke-width="7"/>
  <path d="M477 183q23-18 46 0M462 263h76" fill="none" stroke="#087ff5" stroke-width="5" stroke-linecap="round"/>
  <text x="500" y="316" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="#13395f">COMPRESOR</text>
  <text x="500" y="343" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#42627f">eleva presión y temperatura</text>
  <rect x="700" y="142" width="230" height="145" rx="24" fill="#fff" stroke="#ffd7ba" stroke-width="3"/>
  <g fill="none" stroke="#ff7618" stroke-width="7" stroke-linecap="round"><path d="M735 174v82h30v-82h30v82h30v-82h30v82h30v-82"/><path d="M730 184h150M730 202h150M730 220h150M730 238h150M730 256h150" stroke="#ffc394" stroke-width="3"/></g>
  <text x="815" y="316" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="#13395f">CONDENSADOR</text>
  <text x="815" y="343" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#42627f">libera calor · condensa</text>
  <rect x="495" y="365" width="210" height="95" rx="22" fill="#fff" stroke="#c9e5fc" stroke-width="3"/>
  <path d="M520 412h48m74 0h38m-112-18 36 18-36 18m74-36-38 18 38 18m-38-18v-25m-15 0h30" fill="none" stroke="#087ff5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="600" y="486" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="800" fill="#13395f">EXPANSIÓN · baja presión</text>
  <text x="187" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="2" fill="#087ff5">LADO DE BAJA PRESIÓN</text>
  <text x="818" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="2" fill="#e96716">LADO DE ALTA PRESIÓN</text>
  <text x="600" y="522" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#6b8298">Esquema conceptual; los estados y condiciones exactos dependen del refrigerante y del equipo.</text>
</svg>
