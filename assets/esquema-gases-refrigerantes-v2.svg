<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
  <title id="title">Recorrido del refrigerante en un circuito de compresión</title>
  <desc id="desc">Cuatro estaciones amplias muestran evaporador, compresor, condensador y expansión conectados por flechas sin cruzarse. El lado frío absorbe calor y el lado cálido lo libera.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#edf7ff"/></linearGradient>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#087ff5"/></marker>
    <marker id="orangeArrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#ff7618"/></marker>
  </defs>
  <rect x="2" y="2" width="1196" height="706" rx="32" fill="url(#panel)" stroke="#c6e3fb" stroke-width="3"/>
  <text x="600" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="800" letter-spacing="4" fill="#087ff5">EL RECORRIDO DEL REFRIGERANTE</text>
  <text x="600" y="98" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#58718b">Cuatro procesos conectados: cada equipo tiene condiciones de trabajo propias</text>

  <!-- Circuito dibujado primero para que las flechas queden detrás de las estaciones. -->
  <path d="M540 260H650" fill="none" stroke="#087ff5" stroke-width="11" stroke-linecap="round" marker-end="url(#blueArrow)"/>
  <path d="M900 368V438" fill="none" stroke="#ff7618" stroke-width="11" stroke-linecap="round" marker-end="url(#orangeArrow)"/>
  <path d="M660 548H550" fill="none" stroke="#ff7618" stroke-width="11" stroke-linecap="round" marker-end="url(#orangeArrow)"/>
  <path d="M300 438V368" fill="none" stroke="#087ff5" stroke-width="11" stroke-linecap="round" marker-end="url(#blueArrow)"/>

  <!-- Evaporador -->
  <rect x="60" y="155" width="480" height="213" rx="28" fill="#fff" stroke="#a9dafa" stroke-width="4"/>
  <rect x="82" y="178" width="170" height="166" rx="22" fill="#eff9ff"/>
  <g fill="none" stroke="#1397ed" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M113 210v102h25V210h27v102h25V210h27v102h12"/><path d="M103 220h132M103 244h132M103 268h132M103 292h132" stroke="#8bcdf5" stroke-width="4"/></g>
  <path d="M110 193v-18m45 18v-18m45 18v-18" stroke="#087ff5" stroke-width="4" stroke-linecap="round"/>
  <text x="280" y="221" font-family="Arial,sans-serif" font-size="24" font-weight="800" fill="#123b63">1 · EVAPORADOR</text>
  <text x="280" y="257" font-family="Arial,sans-serif" font-size="16" fill="#486781">Absorbe calor del recinto.</text>
  <text x="280" y="286" font-family="Arial,sans-serif" font-size="16" fill="#486781">El líquido hierve y pasa a vapor.</text>
  <rect x="280" y="309" width="196" height="34" rx="17" fill="#e5f5ff"/>
  <text x="378" y="332" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="1" fill="#0874df">ABSORBE CALOR</text>

  <!-- Compresor -->
  <rect x="660" y="155" width="480" height="213" rx="28" fill="#fff" stroke="#c5d9eb" stroke-width="4"/>
  <rect x="682" y="178" width="170" height="166" rx="22" fill="#f2f8fd"/>
  <path d="M731 309v-77c0-27 17-43 36-43s36 16 36 43v77c0 15-15 23-36 23s-36-8-36-23Z" fill="#e6f1fa" stroke="#416d94" stroke-width="9" stroke-linejoin="round"/>
  <path d="M744 226q23-19 46 0m-59 89h72m-36-127v-14m37 50h22v-23" fill="none" stroke="#087ff5" stroke-width="6" stroke-linecap="round"/>
  <text x="880" y="221" font-family="Arial,sans-serif" font-size="24" font-weight="800" fill="#123b63">2 · COMPRESOR</text>
  <text x="880" y="257" font-family="Arial,sans-serif" font-size="16" fill="#486781">Comprime el vapor aspirado.</text>
  <text x="880" y="286" font-family="Arial,sans-serif" font-size="16" fill="#486781">Suben presión y temperatura.</text>
  <rect x="880" y="309" width="201" height="34" rx="17" fill="#edf5fb"/>
  <text x="980" y="332" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="1" fill="#416d94">APORTA ENERGÍA</text>

  <!-- Condensador -->
  <rect x="660" y="438" width="480" height="213" rx="28" fill="#fff" stroke="#ffd1b0" stroke-width="4"/>
  <rect x="682" y="461" width="170" height="166" rx="22" fill="#fff7f1"/>
  <g fill="none" stroke="#f47721" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M713 493v102h25V493h27v102h25V493h27v102h12"/><path d="M703 503h132M703 527h132M703 551h132M703 575h132" stroke="#ffc18e" stroke-width="4"/></g>
  <path d="M719 481v-15m45 15v-15m45 15v-15" stroke="#ff7618" stroke-width="4" stroke-linecap="round"/>
  <text x="880" y="504" font-family="Arial,sans-serif" font-size="24" font-weight="800" fill="#123b63">3 · CONDENSADOR</text>
  <text x="880" y="540" font-family="Arial,sans-serif" font-size="16" fill="#486781">Cede calor al ambiente.</text>
  <text x="880" y="569" font-family="Arial,sans-serif" font-size="16" fill="#486781">El vapor se vuelve líquido.</text>
  <rect x="880" y="592" width="198" height="34" rx="17" fill="#fff0e4"/>
  <text x="979" y="615" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="1" fill="#df6417">LIBERA CALOR</text>

  <!-- Dispositivo de expansión -->
  <rect x="60" y="438" width="480" height="213" rx="28" fill="#fff" stroke="#b9dcf7" stroke-width="4"/>
  <rect x="82" y="461" width="170" height="166" rx="22" fill="#f1f8fe"/>
  <path d="M105 544h44m65 0h17m-82-31 33 31-33 31m65-62-32 31 32 31m-32-31v-48m-22 0h44" fill="none" stroke="#087ff5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M129 478h42m-21 0v23" fill="none" stroke="#416d94" stroke-width="6" stroke-linecap="round"/>
  <text x="280" y="504" font-family="Arial,sans-serif" font-size="24" font-weight="800" fill="#123b63">4 · EXPANSIÓN</text>
  <text x="280" y="540" font-family="Arial,sans-serif" font-size="16" fill="#486781">Dosifica el paso del refrigerante.</text>
  <text x="280" y="569" font-family="Arial,sans-serif" font-size="16" fill="#486781">Reduce la presión del líquido.</text>
  <rect x="280" y="592" width="196" height="34" rx="17" fill="#e5f5ff"/>
  <text x="378" y="615" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="1" fill="#0874df">REGULA EL PASO</text>

  <text x="600" y="685" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#6b8298">Esquema conceptual. Las presiones, temperaturas y estados exactos dependen del refrigerante y del diseño.</text>
</svg>
